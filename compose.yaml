name: naturapeute

x-django-environment: &django-environment
  DJANGO_SETTINGS_MODULE: core.settings
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-development-secret}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
  POSTGRES_DB: ${POSTGRES_DB:-naturapeute}
  POSTGRES_USER: ${POSTGRES_USER:-naturapeute}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-naturapeute}
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  TEABLE_API_URL: ${TEABLE_API_URL:-https://app.teable.ai}
  TEABLE_BASE_ID: ${TEABLE_BASE_ID:-}
  TEABLE_API_TOKEN: ${TEABLE_API_TOKEN:-}
  TEABLE_CACHE_SECONDS: ${TEABLE_CACHE_SECONDS:-60}
  TEABLE_ENABLED: ${TEABLE_ENABLED:-True}
  EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-contact@naturapeute.ch}
  EMAIL_HOST: ${EMAIL_HOST:-}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
  ACCOUNT_MAGIC_LINK_MAX_AGE: ${ACCOUNT_MAGIC_LINK_MAX_AGE:-900}
  ACCOUNT_MAGIC_LINK_COOLDOWN_SECONDS: ${ACCOUNT_MAGIC_LINK_COOLDOWN_SECONDS:-60}

x-app-volumes: &app-volumes
  - static_data:/app/static
  - media_data:/app/uploads

services:
  db:
    image: postgres:12.7-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-naturapeute}
      POSTGRES_USER: ${POSTGRES_USER:-naturapeute}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-naturapeute}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
    environment: *django-environment
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py collectstatic --noinput"]
    volumes: *app-volumes
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
    environment: *django-environment
    command: ["gunicorn", "--timeout", "60", "--workers", "2", "--bind", "0.0.0.0:8000", "core.wsgi:application"]
    volumes: *app-volumes
    expose:
      - "8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=30)"]
      interval: 15s
      timeout: 35s
      retries: 10
    restart: unless-stopped

  proxy:
    image: nginx:1.27.0-alpine
    ports:
      - "${WEB_PORT:-8000}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  static_data:
  media_data:
